# Test-only configuration. It must be named application.yaml so it replaces the main one during tests.
# Every value is fake and safe to commit.
spring:
  application:
    name: order-service
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      # Flyway builds the tables from the real SQL files. Hibernate only checks them.
      ddl-auto: validate
  rabbitmq:
    listener:
      simple:
        # No RabbitMQ runs during unit tests, so the listeners must not start.
        auto-startup: false
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB

management:
  health:
    # RabbitMQ does not run during unit tests.
    rabbit:
      enabled: false

auth:
  token:
    secret: 0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF # gitleaks:allow (fake, tests only)
  cookie:
    name: access_token

shop:
  currency: LKR
  order-number-prefix: "MX-"
  delivery-fee: 500.00
  couriers:
    - Courier A
    - Courier B
  overdue-cash-days: 14
  max-lines-per-order: 50
  max-quantity-per-line: 100
  default-page-size: 20
  max-page-size: 100

shipments:
  pickup-receipt:
    max-size-bytes: 5242880

product-service:
  base-url: http://localhost:9
  connect-timeout: 1s
  read-timeout: 2s

events:
  exchange: app.events
  payment-queue: order.payment-events

storage:
  s3:
    endpoint: http://localhost:9
    region: us-east-1
    access-key: test
    secret-key: test
    bucket: shipment-documents

logging:
  level:
    org.springframework.web: WARN
    org.hibernate: WARN
