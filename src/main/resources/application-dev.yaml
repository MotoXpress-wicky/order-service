# Profile "dev": the service runs in IntelliJ and uses the helper containers on localhost.
# These values work only on your PC (same as environments/local/env/*.env).
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    username: order_service
    password: order_service_local_pass
  rabbitmq:
    host: localhost
    port: 5672
    username: motoxpress
    password: rabbitmq_local_pass

auth:
  token:
    secret: local-dev-only-jwt-secret-never-use-on-a-server-0123456789

# product-service runs in IntelliJ too (port 8081), or as a container whose port is not published.
product-service:
  base-url: http://localhost:8081

storage:
  s3:
    endpoint: http://localhost:8333
    access-key: order-service-local
    secret-key: order-service-local-secret
