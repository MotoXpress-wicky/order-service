# Runs the tests on every push and pull request. A red run must block the merge (docs/mvp/13-ci-cd.md).
name: CI

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Tests
        run: |
          chmod +x mvnw
          ./mvnw -B verify
